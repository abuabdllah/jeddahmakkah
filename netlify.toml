[build]
  publish = "public"
  command = "python3 build.py"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# توحيد الدومين على النسخة بدون www
[[redirects]]
  from = "https://www.jeddahmakkah.com/*"
  to = "https://jeddahmakkah.com/:splat"
  status = 301
  force = true
